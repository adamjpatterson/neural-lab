[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-lab"
dynamic = ["version"]
authors = [
  { name="FAR Analytics & Research", email="adpatter2000@gmail.com" },
]
description = "A neural network implementation built as an explicit graph of neurons and weighted connections."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.hatch.version]
path = "src/neural_lab/__about__.py"

[project.urls]
Homepage = "https://github.com/adamjpatterson/neural-lab"
Issues = "https://github.com/adamjpatterson/neural-lab/issues"

[tool.pytest.ini_options]
python_files = ["test.py", "test_*.py", "*_test.py"]
